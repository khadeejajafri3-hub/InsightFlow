<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Analytics Video Generator</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1>Video Analytics Pro</h1>
            <p class="subtitle">Transform your CSV data into stunning cinematic reports with AI narration</p>
        </header>

        <main class="glass-card">
            <form id="upload-form" class="form-grid">
                <div class="form-group">
                    <label for="csv_file">Data Discovery (CSV)</label>
                    <input type="file" id="csv_file" name="csv_file" accept=".csv" required>
                </div>

                <div class="form-group">
                    <label for="music_file">Background Vibe (Audio)</label>
                    <input type="file" id="music_file" name="music_file" accept=".mp3,.wav">
                </div>

                <div class="form-group">
                    <label for="theme">Visual Aesthetic</label>
                    <select id="theme" name="theme">
                        <option value="vibrant">Vibrant Pulse</option>
                        <option value="corporate">Corporate sleek</option>
                        <option value="dark">Midnight Noir</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="lang">Narration Language</label>
                    <select id="lang" name="lang">
                        <option value="en">English (Global)</option>
                        <option value="hi">Hindi (India)</option>
                        <option value="es">Spanish</option>
                        <option value="fr">French</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="checkbox-group">
                        <input type="checkbox" name="narrate" checked>
                        <span>Enable AI Voice Narration</span>
                    </label>
                </div>

                <button type="submit" class="btn-generate" id="submit-btn">
                    <span id="btn-text">Generate Story</span>
                </button>
            </form>

            <div id="status-container">
                <div class="status-card">
                    <div id="loader-container">
                        <span class="loader"></span>
                    </div>
                    <h3 id="status-text">Analysing Data...</h3>
                    <p id="status-subtext">This might take a minute depending on your data size</p>
                    
                    <div id="video-preview">
                        <video id="output-video" controls></video>
                        <a id="download-btn" href="#" class="download-link" download>Download Video</a>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        const form = document.getElementById('upload-form');
        const statusContainer = document.getElementById('status-container');
        const statusText = document.getElementById('status-text');
        const videoPreview = document.getElementById('video-preview');
        const outputVideo = document.getElementById('output-video');
        const downloadBtn = document.getElementById('download-btn');
        const submitBtn = document.getElementById('submit-btn');
        const loader = document.getElementById('loader-container');

        form.onsubmit = async (e) => {
            e.preventDefault();
            
            submitBtn.disabled = true;
            statusContainer.style.display = 'block';
            videoPreview.style.display = 'none';
            loader.style.display = 'block';
            statusText.innerText = 'Uploading files...';
            
            const formData = new FormData(form);
            
            try {
                const response = await fetch('/generate', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (data.error) {
                    alert(data.error);
                    submitBtn.disabled = false;
                    return;
                }
                
                const jobId = data.job_id;
                checkStatus(jobId);
                
            } catch (err) {
                alert('Connection error');
                submitBtn.disabled = false;
            }
        };

        async function checkStatus(jobId) {
            const response = await fetch(`/status/${jobId}`);
            const data = await response.json();
            
            if (data.status === 'processing') {
                statusText.innerText = 'Synthesizing Video & Narration...';
            } else if (data.status === 'completed') {
                statusText.innerText = 'Video Ready!';
                loader.style.display = 'none';
                videoPreview.style.display = 'block';
                outputVideo.src = data.video_url;
                downloadBtn.href = data.video_url;
                submitBtn.disabled = false;
                return;
            } else if (data.status === 'failed') {
                statusText.innerText = 'Generation Failed';
                loader.style.display = 'none';
                alert('Error: ' + data.error);
                submitBtn.disabled = false;
                return;
            }
            
            setTimeout(() => checkStatus(jobId), 2000);
        }
    </script>
</body>
</html>
