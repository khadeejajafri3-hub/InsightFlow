<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Report | InsightFlow AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --secondary: #a855f7;
            --bg: #0f172a;
            --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
        body { background: var(--bg); color: white; min-height: 100vh; overflow-x: hidden; }

        .navbar {
            padding: 1.5rem 5%; display: flex; justify-content: space-between; align-items: center;
            background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(10px);
            position: sticky; top: 0; z-index: 100; border-bottom: 1px solid var(--border);
        }
        .logo { font-size: 1.5rem; font-weight: 800; background: linear-gradient(to right, var(--primary), var(--secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .nav-links a { color: #94a3b8; text-decoration: none; margin-left: 2rem; font-weight: 500; transition: 0.3s; }
        .nav-links a:hover { color: white; }
        .logout-btn { padding: 0.6rem 1.2rem; background: rgba(239, 68, 68, 0.1); color: #fca5a5 !important; border: 1px solid rgba(239, 68, 68, 0.2); border-radius: 0.8rem; }

        .hero-section { padding: 4rem 5%; text-align: center; }
        h1 { font-size: 3rem; font-weight: 800; margin-bottom: 1rem; }
        .subtitle { color: #94a3b8; font-size: 1.1rem; max-width: 600px; margin: 0 auto 3rem; }

        .main-container { max-width: 900px; margin: 0 auto 5rem; }
        .glass-card {
            background: var(--glass); backdrop-filter: blur(20px); border: 1px solid var(--border);
            border-radius: 2rem; padding: 3rem;
        }

        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; }
        .full-width { grid-column: span 2; }

        .form-group { display: flex; flex-direction: column; gap: 0.5rem; }
        label { color: #94a3b8; font-size: 0.9rem; font-weight: 500; }
        input, select {
            background: rgba(255,255,255,0.05); border: 1px solid var(--border);
            padding: 1rem; border-radius: 1rem; color: white; font-size: 1rem; transition: 0.3s;
        }
        input:focus, select:focus { outline: none; border-color: var(--primary); background: rgba(255,255,255,0.1); }

        .btn-generate {
            grid-column: span 2; padding: 1.2rem; border-radius: 1rem; border: none;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white; font-weight: 700; font-size: 1.2rem; cursor: pointer;
            transition: 0.4s; margin-top: 1rem;
        }
        .btn-generate:hover { transform: scale(1.02); box-shadow: 0 20px 40px -10px var(--primary); }
        .btn-generate:disabled { opacity: 0.5; cursor: not-allowed; }

        #status-container { margin-top: 3rem; display: none; text-align: center; }
        .loader {
            width: 48px; height: 48px; border: 5px solid #FFF; border-bottom-color: var(--primary);
            border-radius: 50%; display: inline-block; animation: rotation 1s linear infinite;
        }
        @keyframes rotation { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        #video-preview { margin-top: 2rem; display: none; }
        video { width: 100%; border-radius: 1.5rem; border: 1px solid var(--border); box-shadow: 0 30px 60px rgba(0,0,0,0.5); }
        .download-link {
            display: inline-block; margin-top: 1.5rem; padding: 1rem 2.5rem;
            background: white; color: black; text-decoration: none; font-weight: 700;
            border-radius: 1rem; transition: 0.3s;
        }
        .download-link:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(255,255,255,0.2); }

        @media (max-width: 768px) { .form-grid { grid-template-columns: 1fr; } .full-width { grid-column: span 1; } }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo">InsightFlow</div>
        <div class="nav-links">
            <a href="{{ url_for('home') }}">Home</a>
            <a href="{{ url_for('logout') }}" class="logout-btn">Sign Out</a>
        </div>
    </nav>

    <div class="hero-section">
        <h1>Craft Your Narrative</h1>
        <p class="subtitle">Upload your data and let our AI engine synthesize a professional cinematic report in seconds.</p>
    </div>

    <div class="main-container">
        <div class="glass-card">
            <form id="upload-form" class="form-grid">
                <div class="form-group full-width">
                    <label>Project Title</label>
                    <input type="text" name="report_title" placeholder="e.g. Q3 Growth Strategy" required>
                </div>

                <div class="form-group">
                    <label>Data Source (CSV)</label>
                    <input type="file" name="csv_file" accept=".csv" required>
                </div>

                <div class="form-group">
                    <label>Soundtrack (MP3/WAV)</label>
                    <input type="file" name="music_file" accept=".mp3,.wav">
                </div>

                <div class="form-group">
                    <label>Visual Style</label>
                    <select name="theme">
                        <option value="vibrant">Vibrant Neon</option>
                        <option value="corporate">Corporate Blue</option>
                        <option value="dark">Midnight Dark</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Language</label>
                    <select name="lang">
                        <option value="en">English (US)</option>
                        <option value="hi">Hindi (IN)</option>
                        <option value="es">Spanish</option>
                    </select>
                </div>

                <button type="submit" class="btn-generate" id="submit-btn">
                    Generate Cinematic Report
                </button>
            </form>

            <div id="status-container">
                <div id="loader-box">
                    <span class="loader"></span>
                    <h2 id="status-text" style="margin: 1.5rem 0 0.5rem;">Initializing...</h2>
                    <p id="status-subtext" style="color: #94a3b8;">Processing frames and synthesizing audio.</p>
                </div>
                
                <div id="video-preview">
                    <video id="output-video" controls></video>
                    <a id="download-btn" href="#" class="download-link" download>Download 4K Video</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('upload-form');
        const statusContainer = document.getElementById('status-container');
        const statusText = document.getElementById('status-text');
        const videoPreview = document.getElementById('video-preview');
        const loaderBox = document.getElementById('loader-box');
        const outputVideo = document.getElementById('output-video');
        const downloadBtn = document.getElementById('download-btn');
        const submitBtn = document.getElementById('submit-btn');

        form.onsubmit = async (e) => {
            e.preventDefault();
            submitBtn.disabled = true;
            statusContainer.style.display = 'block';
            videoPreview.style.display = 'none';
            loaderBox.style.display = 'block';
            statusText.innerText = 'Uploading...';
            
            const formData = new FormData(form);
            try {
                const response = await fetch('/generate', { method: 'POST', body: formData });
                const data = await response.json();
                if (data.error) { alert(data.error); submitBtn.disabled = false; return; }
                checkStatus(data.job_id);
            } catch (err) { alert('Connection error'); submitBtn.disabled = false; }
        };

        async function checkStatus(jobId) {
            const response = await fetch(`/status/${jobId}`);
            const data = await response.json();
            
            if (data.status === 'processing') {
                statusText.innerText = 'Rendering Story...';
            } else if (data.status === 'completed') {
                statusText.innerText = 'Generation Complete';
                loaderBox.style.display = 'none';
                videoPreview.style.display = 'block';
                outputVideo.src = data.video_url;
                downloadBtn.href = data.video_url;
                submitBtn.disabled = false;
                return;
            } else if (data.status === 'failed') {
                statusText.innerText = 'Error Occurred';
                loaderBox.style.display = 'none';
                alert('Error: ' + data.error);
                submitBtn.disabled = false;
                return;
            }
            setTimeout(() => checkStatus(jobId), 2000);
        }
    </script>
</body>
</html>
