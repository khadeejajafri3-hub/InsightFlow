<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registration Page</title>

<style>
*,
*::before,
*::after {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Roboto, -apple-system, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif;
  background: #0b1f3a; /* Navy Blue */
}

/* ======= MAIN SPLIT CONTAINER ======= */
.main-container {
  display: flex;
  height: 100vh;
}

/* ======= LEFT IMAGE CONTAINER ======= */
.left-container {
  flex: 1;
  background-image: url("https://images.unsplash.com/photo-1677442136019-21780ecad995?q=80&w=2000&auto=format&fit=crop");
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
}

/* ======= RIGHT FORM CONTAINER ======= */
.right-container {
  flex: 1;
  display: flex;
  justify-content: center;
  align-items: center;
}

/* ======= EXISTING FORM SECTION ======= */
.forms-section {
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}

/* Registration Heading (Bold & Visible) */
.section-title {
  font-size: 38px;
  letter-spacing: 1px;
  color: #ffffff;
  font-weight: bold;
}

.forms {
  display: flex;
  align-items: flex-start;
  margin-top: 30px;
}

/* ===== ANIMATION & ORIGINAL STYLES (UNCHANGED) ===== */

.form-wrapper {
  animation: hideLayer .3s ease-out forwards;
}

.form-wrapper.is-active {
  animation: showLayer .3s ease-in forwards;
}

@keyframes showLayer {
  50% { z-index: 1; }
  100% { z-index: 1; }
}

@keyframes hideLayer {
  0% { z-index: 1; }
  49.999% { z-index: 1; }
}

.switcher {
  position: relative;
  cursor: pointer;
  display: block;
  margin: auto;
  padding: 0;
  text-transform: uppercase;
  font-size: 16px;
  letter-spacing: .5px;
  color: #999;
  background-color: transparent;
  border: none;
  outline: none;
  transition: all .3s ease-out;
}

.form-wrapper.is-active .switcher-login {
  color: #fff;
  transform: translateX(90px);
}

.form-wrapper.is-active .switcher-signup {
  color: #fff;
  transform: translateX(-90px);
}

.underline {
  position: absolute;
  bottom: -5px;
  left: 0;
  width: 100%;
  height: 2px;
  overflow: hidden;
}

.underline::before {
  content: '';
  position: absolute;
  width: 100%;
  height: 100%;
  background-color: currentColor;
  transition: transform .2s ease-out;
}

.switcher-login .underline::before {
  transform: translateX(101%);
}

.switcher-signup .underline::before {
  transform: translateX(-101%);
}

.form-wrapper.is-active .underline::before {
  transform: translateX(0);
}

.form {
  overflow: hidden;
  min-width: 300px;
  margin-top: 50px;
  padding: 35px 30px;
  border-radius: 10px;
  transform-origin: top;
}

.form-login {
  animation: hideLogin .3s ease-out forwards;
}

.form-wrapper.is-active .form-login {
  animation: showLogin .3s ease-in forwards;
}

@keyframes showLogin {
  0% { background: #d7e7f1; transform: translate(40%, 10px); }
  50% { transform: translate(0, 0); }
  100% { background-color: #fff; transform: translate(35%, -20px); }
}

@keyframes hideLogin {
  0% { background-color: #fff; transform: translate(35%, -20px); }
  50% { transform: translate(0, 0); }
  100% { background: #d7e7f1; transform: translate(40%, 10px); }
}

.form-signup {
  animation: hideSignup .3s ease-out forwards;
}

.form-wrapper.is-active .form-signup {
  animation: showSignup .3s ease-in forwards;
}

@keyframes showSignup {
  0% { background: #d7e7f1; transform: translate(-40%, 10px) scaleY(.8); }
  50% { transform: translate(0, 0) scaleY(.8); }
  100% { background-color: #fff; transform: translate(-35%, -20px) scaleY(1); }
}

@keyframes hideSignup {
  0% { background-color: #fff; transform: translate(-35%, -20px) scaleY(1); }
  50% { transform: translate(0, 0) scaleY(.8); }
  100% { background: #d7e7f1; transform: translate(-40%, 10px) scaleY(.8); }
}

.input-block {
  margin-bottom: 20px;
}

.input-block label {
  font-size: 14px;
  font-weight: bold;
  color: #0b1f3a;
}

.input-block input {
  width: 100%;
  margin-top: 8px;
  padding: 0 15px;
  font-size: 16px;
  line-height: 40px;
  background: #eef9fe;
  border: 1px solid #cddbef;
  border-radius: 4px;
}

.form button {
  min-width: 120px;
  margin: 30px auto 10px;
  font-size: 18px;
  line-height: 40px;
  border-radius: 25px;
  border: none;
  cursor: pointer;
}

.btn-login {
  color: #fff;
  background: #00c896;
}

.btn-signup {
  color: #00c896;
  background: #fff;
  box-shadow: inset 0 0 0 2px #00c896;
}

/* flash message styles */
.flash-message { padding: 12px 16px; border-radius: 6px; margin: 16px auto; max-width: 520px; font-weight: 600; }
.flash-message.success { background: #d4edda; color: #1b5e20; }
.flash-message.error { background: #f8d7da; color: #6b0b0b; }

</style>
</head>

<body>
  
{% for category, message in get_flashed_messages(with_categories=True) %}
  <div class="flash-message {{ category }}">{{ message }}</div>
{% endfor %}
<div class="main-container">

  <!-- LEFT IMAGE -->
  <div class="left-container"></div>

  <!-- RIGHT LOGIN/SIGNUP -->
  <div class="right-container">
    <section class="forms-section">
      <h1 class="section-title">Registeration</h1>

      <div class="forms">

        <div class="form-wrapper is-active">
          <button type="button" class="switcher switcher-login">
            Login
            <span class="underline"></span>
          </button>
          <form method="post" action="/register" class="form form-login">
            <div class="input-block">
              <label>E-mail</label>
              <input id="email" name="email" type="email" required>
            </div>
            <div class="input-block">
              <label>Password</label>
              <input id="password" name="password" type="password" required>
            </div>
            <button type="submit" name="action" value="login" class="btn-login">Login</button>
          </form>
        </div>

        <div class="form-wrapper">
          <button type="button" class="switcher switcher-signup">
            Sign Up
            <span class="underline"></span>
          </button>
          <form method="post" action="/register" class="form form-signup">
            <div class="input-block">
              <label>E-mail</label>
              <input id="email" name="email" type="email" required>
            </div>
            <div class="input-block">
              <label>Password</label>
              <input id="password" name="password" type="password" required>
            </div>
            <div class="input-block">
              <label>Confirm password</label>
              <input id="cpass" name="cpass" type="password" required>
            </div>
            <button type="submit" name="action" value="signup" class="btn-signup">Continue</button>
          </form>
        </div>

      </div>
    </section>
  </div>

</div>
<script>
const switchers = [...document.querySelectorAll('.switcher')]

switchers.forEach(item => {
  item.addEventListener('click', function() {
    switchers.forEach(item => item.parentElement.classList.remove('is-active'))
    this.parentElement.classList.add('is-active')
  })
})
</script>

</body>
</html>
